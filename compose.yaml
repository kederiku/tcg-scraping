services:
  crawler:
    build:
      context: .
      args:
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    init: true
    shm_size: 1gb
    security_opt:
      - seccomp=./docker/seccomp_profile.json
      - no-new-privileges:true
    volumes:
      - .:/app
    environment:
      DOWNLOAD_DELAY: ${DOWNLOAD_DELAY:-3}
      HTTP_CACHE: ${HTTP_CACHE:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      HTTP_USER_AGENT: ${HTTP_USER_AGENT:-tcg-scraping/0.1 (+https://github.com/kederiku/tcg-scraping)}
    command: ["scrapy", "list"]
