name: Container checks

on:
  # This required check must also run for documentation-only changes.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container:
    # Standard public-repository runners are free. Skip if made private.
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Match container user to checkout owner
        run: |
          echo "USER_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "USER_GID=$(id -g)" >> "$GITHUB_ENV"
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build Chromium container
        run: make build
      - name: Lint and run local HTTP/Chromium tests in container
        run: make check
      - name: Check PowerShell command wrapper
        shell: pwsh
        run: ./tests/test_commands.ps1
